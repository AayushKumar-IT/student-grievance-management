# Server
server.port=${PORT:2718}

# Database
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:grievance_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
# ⚠️  SET YOUR LOCAL MYSQL PASSWORD BELOW (replace YOUR_PASSWORD)
spring.datasource.password=${MYSQLPASSWORD:Neyash}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Prevent Jackson from failing on Hibernate lazy-load proxies
spring.jackson.serialization.fail-on-empty-beans=false

# JWT
# Generate with: openssl rand -base64 32  (Linux/Mac)
# Or PowerShell:  [Convert]::ToBase64String((1..32 | ForEach-Object { [byte](Get-Random -Max 256) }))
jwt.secret=${JWT_SECRET:nkCpp97jwo7Z5MFdwNfCmOk40rVN+zrTP9wJLtz+LOQ=}
jwt.expiration=86400000

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=uploads

# AI Server
ai.server.url=${AI_SERVER_URL:http://localhost:8000}

# Logging
logging.level.com.grievance=DEBUG
logging.level.org.springframework.security=DEBUG

# Async thread pool
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-
