<app-sidebar />
<div class="main-content">
  <app-navbar />
  <div class="page-content">
    <div class="page-header">
      <div><h2>Assigned Grievances</h2><p class="text-muted">Grievances assigned to you for review</p></div>
    </div>
    <app-loading-spinner *ngIf="loading" />
    <div class="alert alert-danger" *ngIf="error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
    <ng-container *ngIf="!loading && !error">
      <div class="card filters-card">
        <div class="filters-row">
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" class="form-control" placeholder="Search by title..."
                   [(ngModel)]="searchTerm" (ngModelChange)="applyFilters()" />
          </div>
          <select class="form-control filter-select" [(ngModel)]="statusFilter" (ngModelChange)="applyFilters()">
            <option value="">All Statuses</option>
            <option *ngFor="let s of statuses" [value]="s">{{ s | titlecase }}</option>
          </select>
          <button *ngIf="hasFilters" class="btn btn-secondary" (click)="clearFilters()">
            <i class="fas fa-times"></i> Clear
          </button>
        </div>
        <p class="results-count">Showing <strong>{{ filtered.length }}</strong> of <strong>{{ grievances.length }}</strong></p>
      </div>
      <div class="empty-state card" *ngIf="!filtered.length">
        <i class="fas fa-inbox"></i>
        <h3>{{ hasFilters ? 'No results found' : 'No assigned grievances' }}</h3>
        <p>{{ hasFilters ? 'Try clearing your filters.' : 'No grievances have been assigned to you yet.' }}</p>
      </div>
      <div class="grievances-grid" *ngIf="filtered.length">
        <app-grievance-card *ngFor="let g of filtered" [grievance]="g"
          (viewDetails)="goToReview($event)" />
      </div>
    </ng-container>
  </div>
</div>
